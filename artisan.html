<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait artisan — Main & Outil</title><link rel="stylesheet" href="styles.css?v=2"></head><body><div data-header></div><main id="profile"></main><div data-footer></div><script src="script.js?v=3"></script><script>const slug=new URLSearchParams(location.search).get('id')||'atelier-maroline';const a=artisans.find(x=>x.slug===slug)||artisans[0];const stories={'atelier-maroline':`<p class="quote">Et si, pour créer un sac, on ne commençait pas par le dessiner ?</p><h2>La matière comme point de départ</h2><p>Chez Atelier Maroline, la création peut commencer bien avant le premier coup de cutter. Une couleur, une texture, la souplesse d’un cuir, mais aussi une personne et sa façon de porter ses accessoires peuvent devenir le point de départ d’une nouvelle pièce.</p><p>Face à un cuir, sa texture, sa couleur ou sa tenue suggèrent déjà certaines possibilités. Marion travaille notamment avec des surplus issus de l’industrie de la mode. La contrainte devient une source d’inspiration et chaque chute peut à son tour devenir un petit objet.</p><h2>Observer ceux qui porteront ses créations</h2><p>Une manière de s’habiller, une association de couleurs, une silhouette : Marion observe les usages qui l’entourent. La maroquinerie devient un dialogue entre la matière, le regard de l’artisane et la personne qui portera l’objet.</p><h2>Pourquoi cette rencontre ?</h2><p>Parce qu’Atelier Maroline montre une autre façon de penser la création : ne pas imposer une idée à la matière, mais l’observer, comprendre ce qu’elle permet, puis laisser progressivement apparaître l’objet.</p>`,'atelier-du-vitrail':`<p class="quote">Et si le vitrail n’était pas fait uniquement pour les églises ?</p><h2>Plus de 25 ans à travailler le verre et la lumière</h2><p>Après des études d’architecture et une formation auprès d’un maître verrier, Hélène Espié fait ses armes dans le vitrail traditionnel et le patrimoine : églises, chapelles, peinture sur verre et assemblage au plomb.</p><p>Cette expérience lui donne une connaissance profonde du verre, de la couleur et surtout de ce qui donne véritablement vie à un vitrail : la lumière.</p><h2>Créer avec le lieu</h2><p>Hélène ne crée pas seulement un vitrail. Elle observe l’architecture, les couleurs, le mobilier et la lumière naturelle. Une fenêtre, une porte, une cage d’escalier ou une cloison deviennent le cadre d’une œuvre sur mesure qui se transforme au fil de la journée.</p><h2>Un pont entre tradition et modernité</h2><p>Art nouveau, art déco, classique, graphique ou contemporain : le savoir-faire reste traditionnel, son utilisation continue d’évoluer. À travers des ateliers et démonstrations, Hélène transmet aussi les gestes reçus des générations précédentes.</p>`};document.title=`${a.name} — Main & Outil`;document.querySelector('#profile').innerHTML=`<section class="artisan-head"><div class="artisan-visual" style="background-image:url('${a.image}')"></div><div class="artisan-copy"><span class="eyebrow">${a.metier}</span><h1>${a.name}</h1><p>${a.person}</p><div class="meta"><span>⌖ ${a.ville}</span><span>${a.departement}</span></div><p>${a.excerpt}</p><div class="actions">${a.youtube?`<a class="btn gold" href="${a.youtube}">Voir sur YouTube</a>`:''}${a.site?`<a class="btn" href="${a.site}">Visiter le site</a>`:''}</div></div></section><section class="gallery-section"><div class="wrap"><div class="gallery-head"><div><span class="eyebrow">Dans l’atelier</span><h2>Quelques images de la rencontre</h2></div><div class="gallery-controls"><button class="gallery-prev" aria-label="Photo précédente">←</button><button class="gallery-next" aria-label="Photo suivante">→</button></div></div><div class="gallery-track">${a.gallery.map((src,i)=>`<figure class="gallery-slide"><img src="${src}" alt="${a.person} dans son atelier — photo ${i+1}" loading="${i<2?'eager':'lazy'}"><figcaption>${String(i+1).padStart(2,'0')} / ${String(a.gallery.length).padStart(2,'0')}</figcaption></figure>`).join('')}</div></div></section><section class="section"><article class="prose">${stories[a.slug]}</article></section><section class="section" style="background:var(--papier2)"><div class="wrap"><span class="eyebrow">Informations pratiques</span><h2>${a.name}</h2><p>${a.address}</p>${a.phone?`<p><a href="tel:${a.phone.replaceAll(' ','')}">${a.phone}</a></p>`:''}${a.email?`<p><a href="mailto:${a.email}">${a.email}</a></p>`:''}</div></section>`;initGallery();</script></body></html>
